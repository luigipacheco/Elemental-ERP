server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static assets get long-lived caching.
    location /assets/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: any unknown route renders index.html so React Router can
    # handle it client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Disable caching of index.html so deploys propagate immediately.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri =404;
    }
}
